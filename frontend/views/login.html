<section class="auth-page d-flex align-items-center p-3">
  <div class="auth-card w-100">
    <div class="text-center text-white mb-4">
      <h1 class="h2"><span class="brand-mark">●</span> EnduroTrack</h1>
      <p class="text-white-50">Train smarter. Track progress.</p>
    </div>
    <div class="card p-4 p-md-5">
      <h2 class="h4">Welcome back</h2>
      <p class="text-secondary">Sign in to your training workspace.</p>
      <form data-auth-form="login">
        <label class="form-label mt-3" for="login-email">Email</label>
        <input id="login-email" class="form-control mb-3" type="email"
               placeholder="you@example.com" required>
        <label class="form-label" for="login-password">Password</label>
        <input id="login-password" class="form-control mb-4" type="password"
               placeholder="Password" required>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
      <p class="text-center text-secondary small mt-4 mb-0">
        New to EnduroTrack?
        <a href="#" data-page="register">Create an account</a>
      </p>
    </div>
  </div>
</section>
